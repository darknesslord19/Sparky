name: APK Derle

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'
      - name: Lottie oynaticisini indir
        run: curl -fsSL -o app/src/main/assets/web/lottie.min.js https://cdnjs.cloudflare.com/ajax/libs/lottie-web/5.12.2/lottie.min.js
      - name: APK olustur
        shell: bash
        run: |
          set -o pipefail
          gradle assembleDebug --no-daemon 2>&1 | tee /tmp/build.log
      - name: Hata kaydini 'log' dalina koy
        if: failure()
        run: |
          mkdir -p /tmp/log && cp /tmp/build.log /tmp/log/ || true
          cd /tmp/log
          git init -q -b log
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A && git commit -qm "build log"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" log
      - name: APK adini duzenle
        run: cp app/build/outputs/apk/debug/app-debug.apk SparkyMesaj.apk
      - name: APK'yi yukle (Actions)
        uses: actions/upload-artifact@v4
        with:
          name: SparkyMesaj-APK
          path: SparkyMesaj.apk
      - name: Releases'a koy (dogrudan indirme baglantisi)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Sparky Mesaj (son surum)
          body: "Android TV'ye kurmak icin SparkyMesaj.apk dosyasini indirin."
          files: SparkyMesaj.apk
          make_latest: true
      - name: Ikon onizlemeleri
        continue-on-error: true
        run: |
          mkdir -p /tmp/out
          npm i --no-save playwright@1.47.2
          npx playwright install --with-deps chromium
          node tools/preview.js
      - name: APK'yi 'apk' dalina koy
        run: |
          mkdir -p /tmp/out && cp SparkyMesaj.apk /tmp/out/
          cd /tmp/out
          git init -q -b apk
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A
          git commit -qm "APK ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" apk

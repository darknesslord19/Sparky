<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f2438">
<title>Sparky Mesaj</title>
<style>
  :root{
    --bg1:#0f2438; --bg2:#1c4e7c; --glass:rgba(255,255,255,.10); --line:rgba(255,255,255,.22);
    --text:#fff; --muted:#b7c9da; --accent:#8fe3ff; --accent2:#c7a6ff; --ok:#6be3a4; --err:#ff8a8a;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{margin:0;min-height:100vh;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--text);
       background:linear-gradient(160deg,var(--bg1),var(--bg2)) fixed;padding:16px 16px 40px}
  .wrap{max-width:560px;margin:0 auto}
  header{display:flex;align-items:center;gap:12px;margin:6px 0 16px}
  header svg{width:46px;height:46px;flex:none}
  h1{font-size:22px;margin:0}
  .dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--muted);margin-right:6px;vertical-align:middle}
  .dot.on{background:var(--ok)} .dot.off{background:var(--err)}
  #conn{font-size:13px;color:var(--muted)}
  .card{background:var(--glass);border:1px solid var(--line);border-radius:20px;padding:16px;margin-bottom:14px;
        backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
  label{font-size:13px;color:var(--muted);display:block;margin:0 0 6px}
  input[type=text],textarea,select{width:100%;font:inherit;font-size:16px;color:var(--text);background:rgba(0,0,0,.22);
        border:1px solid var(--line);border-radius:14px;padding:12px 14px;outline:none}
  textarea{min-height:96px;resize:vertical}
  input:focus,textarea:focus,select:focus{border-color:var(--accent)}
  select option{color:#000}
  .row{display:flex;gap:10px}
  .row>*{flex:1}
  .emojis{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0 2px}
  .emojis button{font-size:22px;background:rgba(255,255,255,.08);border:1px solid var(--line);border-radius:12px;
        width:44px;height:44px;cursor:pointer}
  .quick{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
  .quick button{font:inherit;font-size:13px;color:var(--text);background:rgba(255,255,255,.08);border:1px solid var(--line);
        border-radius:999px;padding:7px 12px;cursor:pointer}
  .btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;font:inherit;font-weight:700;font-size:17px;
       color:#08243a;background:linear-gradient(90deg,var(--accent),var(--accent2));border:0;border-radius:16px;padding:14px;cursor:pointer;margin-top:12px}
  .btn.ghost{background:rgba(255,255,255,.10);color:var(--text);border:1px solid var(--line);font-weight:600}
  .btn:disabled{opacity:.55}
  .btn.rec{background:linear-gradient(90deg,#ff7a7a,#ffb36b)}
  .opts{display:flex;gap:10px;margin-top:12px;align-items:end}
  .opts>div{flex:1}
  .switch{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--muted);margin-top:12px}
  .switch input{width:20px;height:20px;accent-color:#8fe3ff}
  #preview{display:none;margin-top:10px;max-width:100%;max-height:220px;border-radius:14px;border:1px solid var(--line)}
  audio{width:100%;margin-top:10px;display:none}
  .hint{font-size:12px;color:var(--muted);margin-top:8px;line-height:1.45}
  #toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%) translateY(120px);background:rgba(15,36,56,.95);
         border:1px solid var(--line);border-radius:14px;padding:12px 18px;font-size:15px;transition:transform .3s;max-width:90vw;z-index:9}
  #toast.show{transform:translateX(-50%) translateY(0)}
  #history{list-style:none;padding:0;margin:0;font-size:14px}
  #history li{padding:8px 0;border-bottom:1px solid rgba(255,255,255,.08);color:var(--muted)}
  #history li b{color:var(--text);font-weight:600}
  h2{font-size:15px;margin:0 0 10px}
  .tabs{display:flex;gap:6px;margin-bottom:12px}
  .tabs button{flex:1;font:inherit;font-size:14px;color:var(--text);background:rgba(255,255,255,.06);border:1px solid var(--line);
        border-radius:12px;padding:10px 4px;cursor:pointer}
  .tabs button.active{background:rgba(143,227,255,.22);border-color:var(--accent)}
  .pane{display:none}.pane.active{display:block}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <svg viewBox="0 0 48 48" aria-hidden="true">
      <circle cx="24" cy="24" r="23" fill="#1c4e7c"/>
      <path fill="#7ad3ff" d="M24,6 C27,11 34,14 35,25 C36,34 30.5,41 24,41 C17.5,41 12,34 13,25 C13.5,20 16,17 18,13 C19,16.5 20.5,18 22,18 C21,13 22,9.5 24,6 Z"/>
      <path fill="#c9f1ff" d="M24,20 C28,21.5 31,25 31,30 C31,35 27.8,38 24,38 C20.2,38 17,35 17,30 C17,25 20,21.5 24,20 Z"/>
      <ellipse cx="20.5" cy="27.5" rx="1.8" ry="2.2" fill="#0b2540"/><ellipse cx="27.5" cy="27.5" rx="1.8" ry="2.2" fill="#0b2540"/>
      <path d="M21,32 Q24,35 27,32" stroke="#0b2540" stroke-width="1.6" fill="none" stroke-linecap="round"/>
    </svg>
    <div>
      <h1>Sparky Mesaj</h1>
      <div id="conn"><span class="dot" id="dot"></span><span id="connText">TV'ye bağlanılıyor…</span></div>
    </div>
  </header>

  <div class="card">
    <label for="name">Gönderen adı (TV'de "… ile Mesaj:" olarak görünür)</label>
    <input type="text" id="name" maxlength="30" placeholder="Sparky">
  </div>

  <div class="card">
    <div class="tabs">
      <button class="active" data-tab="t-text">✏️ Yazı</button>
      <button data-tab="t-img">🖼️ Resim</button>
      <button data-tab="t-voice">🎤 Sesli</button>
    </div>

    <div class="pane active" id="t-text">
      <textarea id="msg" maxlength="400" placeholder="Mesajını yaz…"></textarea>
      <div class="emojis">
        <button>🍿</button><button>🎬</button><button>🎥</button><button>❤️</button><button>😂</button>
        <button>👋</button><button>🔥</button><button>😴</button><button>🍕</button><button>☕</button>
      </div>
      <div class="quick">
        <button>Bu akşam sinema keyfi yapalım mı? 🍿🎥🎬</button>
        <button>Yemek hazır! 🍽️</button>
        <button>Sesi biraz kısar mısın? 🔉</button>
        <button>Birazdan geliyorum 🏃</button>
        <button>İyi geceler 🌙</button>
      </div>
      <button class="btn" id="sendText">Gönder ➤</button>
    </div>

    <div class="pane" id="t-img">
      <input type="file" id="img" accept="image/*" hidden>
      <button class="btn ghost" id="pickImg">🖼️ Fotoğraf seç / çek</button>
      <img id="preview" alt="">
      <input type="text" id="imgText" maxlength="200" placeholder="Fotoğrafın altına yazı (isteğe bağlı)" style="margin-top:10px">
      <button class="btn" id="sendImg" disabled>Resmi gönder ➤</button>
    </div>

    <div class="pane" id="t-voice">
      <button class="btn rec" id="recBtn">🎤 Kaydı başlat</button>
      <input type="file" id="aud" accept="audio/*" capture hidden>
      <button class="btn ghost" id="pickAud">📁 Hazır ses dosyası seç</button>
      <audio id="player" controls></audio>
      <input type="text" id="audText" maxlength="80" placeholder="Alt yazı (isteğe bağlı)" style="margin-top:10px">
      <button class="btn" id="sendAud" disabled>Sesli mesajı gönder ➤</button>
      <div class="hint" id="micHint"></div>
    </div>

    <div class="opts">
      <div>
        <label for="sec">Ekranda kalma</label>
        <select id="sec"><option value="5">5 sn</option><option value="8" selected>8 sn</option>
          <option value="12">12 sn</option><option value="20">20 sn</option><option value="30">30 sn</option></select>
      </div>
      <div>
        <label for="pos">Konum</label>
        <select id="pos"><option value="center" selected>Ortada</option><option value="bottom">Altta</option><option value="top">Üstte</option></select>
      </div>
    </div>
    <label class="switch"><input type="checkbox" id="sound" checked> Bildirim sesi çalsın</label>
  </div>

  <div class="card">
    <h2>Son gönderilenler</h2>
    <ul id="history"></ul>
  </div>
</div>
<div id="toast"></div>

<script>
(function(){
  var $ = function(id){ return document.getElementById(id); };
  function store(k, v){ try{ if(v===undefined) return localStorage.getItem(k); localStorage.setItem(k, v); }catch(e){ return null; } }

  // ayarlari hatirla
  $('name').value = store('name') || 'Sparky';
  if (store('posv') !== '2'){ store('pos','center'); store('posv','2'); }
  ['sec','pos'].forEach(function(k){ var v = store(k); if(v) $(k).value = v; });
  if (store('sound') === '0') $('sound').checked = false;
  ['name','sec','pos'].forEach(function(k){ $(k).addEventListener('change', function(){ store(k, $(k).value); }); });
  $('sound').addEventListener('change', function(){ store('sound', $('sound').checked ? '1':'0'); });

  function toast(t, ok){
    var el = $('toast'); el.textContent = t; el.style.borderColor = ok===false ? 'var(--err)' : 'var(--line)';
    el.classList.add('show'); clearTimeout(el._t); el._t = setTimeout(function(){ el.classList.remove('show'); }, 2600);
  }

  function params(extra){
    var p = new URLSearchParams();
    p.set('name', $('name').value.trim() || 'Sparky');
    p.set('sec', $('sec').value);
    p.set('pos', $('pos').value);
    p.set('sound', $('sound').checked ? '1' : '0');
    for (var k in extra) p.set(k, extra[k]);
    return p;
  }

  function addHistory(t){
    var list = [];
    try{ list = JSON.parse(store('hist') || '[]'); }catch(e){}
    var d = new Date();
    list.unshift({t:t, at:d.getHours().toString().padStart(2,'0')+':'+d.getMinutes().toString().padStart(2,'0')});
    list = list.slice(0, 15);
    store('hist', JSON.stringify(list));
    renderHistory();
  }
  function renderHistory(){
    var list = []; try{ list = JSON.parse(store('hist') || '[]'); }catch(e){}
    var ul = $('history'); ul.innerHTML = '';
    if (!list.length){ ul.innerHTML = '<li>Henüz mesaj yok</li>'; return; }
    list.forEach(function(h){ var li = document.createElement('li'); var b = document.createElement('b');
      b.textContent = h.at + '  '; li.appendChild(b); li.appendChild(document.createTextNode(h.t)); ul.appendChild(li); });
  }
  renderHistory();

  // zaman asimli istek
  function tfetch(url, opt, ms){
    var ctl = window.AbortController ? new AbortController() : null;
    var t = ctl ? setTimeout(function(){ ctl.abort(); }, ms) : null;
    if (ctl) opt.signal = ctl.signal;
    return fetch(url, opt).finally(function(){ if (t) clearTimeout(t); });
  }
  // gonderim: baglanti koparsa 4 kez otomatik yeniden dener
  function post(url, body, btn, label, okText){
    btn.disabled = true; var old = btn.textContent;
    var big = body instanceof Blob && body.size > 200000;
    var tries = 0, max = 4;
    function attempt(){
      tries++;
      btn.textContent = tries > 1 ? ('Yeniden deneniyor… (' + tries + '/' + max + ')') : 'Gönderiliyor…';
      return tfetch(url, {method:'POST', body: body, cache:'no-store'}, big ? 90000 : 7000)
        .then(function(r){ return r.json(); })
        .then(function(j){
          setOnline(true);
          if (j.ok){ toast('✅ ' + okText); addHistory(label); return true; }
          toast('⚠️ ' + (j.message || 'Hata'), false); return false;
        })
        .catch(function(){
          if (tries < max) return new Promise(function(res){ setTimeout(res, 700 * tries); }).then(attempt);
          setOnline(false);
          toast('⚠️ TV\'ye ulaşılamadı. Aynı Wi-Fi\'da mısın? TV açık mı?', false); return false;
        });
    }
    return attempt().finally(function(){ btn.disabled = false; btn.textContent = old; });
  }

  // sekmeler
  document.querySelectorAll('.tabs button').forEach(function(b){
    b.addEventListener('click', function(){
      document.querySelectorAll('.tabs button').forEach(function(x){ x.classList.remove('active'); });
      document.querySelectorAll('.pane').forEach(function(x){ x.classList.remove('active'); });
      b.classList.add('active'); $(b.dataset.tab).classList.add('active');
    });
  });

  // ---- yazi ----
  document.querySelectorAll('.emojis button').forEach(function(b){
    b.addEventListener('click', function(){ var m = $('msg'); m.value += b.textContent; m.focus(); });
  });
  document.querySelectorAll('.quick button').forEach(function(b){
    b.addEventListener('click', function(){ $('msg').value = b.textContent; $('msg').focus(); });
  });
  $('sendText').addEventListener('click', function(){
    var t = $('msg').value.trim();
    if (!t){ toast('Önce bir mesaj yaz ✏️', false); return; }
    var body = params({text: t});
    post('/api/send?pos=' + encodeURIComponent($('pos').value), body, $('sendText'), t, 'TV\'de gösteriliyor')
      .then(function(ok){ if (ok) $('msg').value = ''; });
  });
  $('msg').addEventListener('keydown', function(e){ if (e.key === 'Enter' && !e.shiftKey){ e.preventDefault(); $('sendText').click(); } });

  // ---- resim ----
  var imgBlob = null;
  $('pickImg').addEventListener('click', function(){ $('img').click(); });
  $('img').addEventListener('change', function(){
    var f = $('img').files[0]; if (!f) return;
    shrink(f, 1600, function(blob){
      imgBlob = blob;
      $('preview').src = URL.createObjectURL(blob); $('preview').style.display = 'block';
      $('sendImg').disabled = false;
    });
  });
  function shrink(file, max, cb){
    var img = new Image();
    img.onload = function(){
      var w = img.naturalWidth, h = img.naturalHeight, s = Math.min(1, max / Math.max(w, h));
      var c = document.createElement('canvas'); c.width = Math.round(w*s); c.height = Math.round(h*s);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      c.toBlob(function(b){ cb(b || file); }, 'image/jpeg', 0.86);
    };
    img.onerror = function(){ cb(file); };
    img.src = URL.createObjectURL(file);
  }
  $('sendImg').addEventListener('click', function(){
    if (!imgBlob) return;
    var t = $('imgText').value.trim();
    var p = params({text: t});
    post('/api/image?' + p.toString(), imgBlob, $('sendImg'), '🖼️ Resim' + (t ? ': ' + t : ''), 'Resim TV\'de')
      .then(function(ok){ if (ok){ imgBlob = null; $('preview').style.display='none'; $('imgText').value=''; $('sendImg').disabled = true; } });
  });

  // ---- sesli mesaj ----
  var audBlob = null, audMime = '', rec = null, chunks = [], recTimer = null, recStart = 0;
  var canRec = !!(window.isSecureContext && navigator.mediaDevices && window.MediaRecorder);
  if (!canRec){
    $('recBtn').textContent = '🎤 Telefonla kaydet';
    $('micHint').innerHTML = 'Not: Tarayıcı, güvenli olmayan (http) adreslerde mikrofona doğrudan izin vermiyor. ' +
      '"Telefonla kaydet" telefonunun ses kaydedicisini açar. Açılmazsa önce ses kaydedici ile kaydedip "Hazır ses dosyası seç" ile gönder.<br>' +
      'İstersen Chrome\'da <b>chrome://flags</b> → "Insecure origins treated as secure" kısmına <b>' + location.origin + '</b> yazıp etkinleştirince doğrudan buradan kayıt yapabilirsin.';
  }
  function setAudio(blob, mime){
    audBlob = blob; audMime = mime || blob.type || 'audio/mp4';
    var pl = $('player'); pl.src = URL.createObjectURL(blob); pl.style.display = 'block';
    $('sendAud').disabled = false;
  }
  $('recBtn').addEventListener('click', function(){
    if (!canRec){ $('aud').click(); return; }
    if (rec && rec.state === 'recording'){ rec.stop(); return; }
    navigator.mediaDevices.getUserMedia({audio:true}).then(function(stream){
      chunks = [];
      var mime = ['audio/mp4','audio/webm;codecs=opus','audio/ogg;codecs=opus','audio/webm'].find(function(m){ return MediaRecorder.isTypeSupported && MediaRecorder.isTypeSupported(m); }) || '';
      rec = mime ? new MediaRecorder(stream, {mimeType: mime}) : new MediaRecorder(stream);
      rec.ondataavailable = function(e){ if (e.data.size) chunks.push(e.data); };
      rec.onstop = function(){
        stream.getTracks().forEach(function(t){ t.stop(); }); clearInterval(recTimer);
        $('recBtn').textContent = '🎤 Yeniden kaydet';
        setAudio(new Blob(chunks, {type: rec.mimeType || mime}), rec.mimeType || mime);
      };
      rec.start(); recStart = Date.now();
      recTimer = setInterval(function(){ var s = Math.floor((Date.now()-recStart)/1000);
        $('recBtn').textContent = '⏹️ Durdur  0:' + String(s).padStart(2,'0'); if (s >= 120) rec.stop(); }, 250);
    }).catch(function(){ toast('Mikrofon izni verilmedi', false); $('aud').click(); });
  });
  $('pickAud').addEventListener('click', function(){ $('aud').removeAttribute('capture'); $('aud').click(); });
  $('aud').addEventListener('change', function(){ var f = $('aud').files[0]; if (f) setAudio(f, f.type); $('aud').setAttribute('capture',''); });
  $('sendAud').addEventListener('click', function(){
    if (!audBlob) return;
    var t = $('audText').value.trim();
    var p = params({text: t, mime: audMime});
    post('/api/audio?' + p.toString(), audBlob, $('sendAud'), '🎤 Sesli mesaj' + (t ? ': ' + t : ''), 'Sesli mesaj TV\'de çalıyor')
      .then(function(ok){ if (ok){ audBlob = null; $('player').style.display='none'; $('audText').value=''; $('sendAud').disabled = true; } });
  });

  // ---- baglanti durumu (koparsa hizli yeniden baglanir) ----
  var online = null, pingTimer = null;
  function setOnline(v, overlay){
    online = v;
    $('dot').className = 'dot ' + (v ? 'on' : 'off');
    if (v) $('connText').textContent = overlay === false ? 'TV\'ye bağlı · TV\'de "üstte gösterme" izni verilmemiş!' : 'TV\'ye bağlı · hazır';
    else $('connText').textContent = 'Bağlantı koptu · yeniden bağlanılıyor…';
  }
  function ping(){
    clearTimeout(pingTimer);
    tfetch('/api/status?t=' + Date.now(), {cache:'no-store'}, 4000).then(function(r){ return r.json(); })
      .then(function(j){ setOnline(true, j.overlay); pingTimer = setTimeout(ping, 10000); })
      .catch(function(){ setOnline(false); pingTimer = setTimeout(ping, 2000); });
  }
  // telefon ekrani acilinca / sekmeye donulunce hemen kontrol et
  document.addEventListener('visibilitychange', function(){ if (!document.hidden) ping(); });
  window.addEventListener('online', ping);
  window.addEventListener('focus', ping);
  ping();
})();
</script>
</body>
</html>

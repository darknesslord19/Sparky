plugins {
    id 'com.android.application'
}

android {
    namespace 'com.sparky.tvmesaj'
    compileSdk 34

    defaultConfig {
        applicationId 'com.sparky.tvmesaj'
        minSdk 21
        targetSdk 33
        versionCode 1
        versionName '1.0'
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // QR kod uretimi (3.3.x eski Android TV'lerle de uyumlu)
    implementation 'com.google.zxing:core:3.3.3'
}
